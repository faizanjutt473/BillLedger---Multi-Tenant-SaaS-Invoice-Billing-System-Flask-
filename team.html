<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BillLedger</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-page="team" data-title="Team and reminders"><div class="wrap"><div class="grid2"><div class="card"><h2>Team and roles</h2><table class="tbl"><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody id="tm"></tbody></table><br><form id="inv" class="form2" style="align-items:end;margin:0"><div><label for="ie">Invite by email</label><input id="ie" type="email" required></div><div><label for="ir">Role</label><select id="ir"><option>accountant</option><option>client</option><option>admin</option></select></div><button class="btn">Send invite</button></form></div><div class="card"><h2>Payment reminders</h2><label class="chk"><input type="checkbox" checked> 3 days before the due date</label><label class="chk"><input type="checkbox" checked> On the due date</label><label class="chk"><input type="checkbox" checked> Every 7 days when overdue</label><br><button id="rem" class="btn">Save reminder rules</button></div></div></div><script src="js/app.js"></script></body></html>
