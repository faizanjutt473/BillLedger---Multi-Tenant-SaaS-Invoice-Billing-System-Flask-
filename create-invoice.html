<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BillLedger</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body data-page="create-invoice" data-title="New invoice"><div class="wrap"><div class="card"><div class="form2"><div><label for="c">Client</label><select id="c"><option>Nadeem Traders</option><option>Bright Pixel Agency</option><option>Lahore Fabrics</option></select></div><div><label for="d">Due date</label><input id="d" type="date"></div></div>
<table class="tbl items"><thead><tr><th>Description</th><th>Qty</th><th>Price</th><th class="r">Amount</th><th></th></tr></thead><tbody id="lines"></tbody></table><br><button type="button" id="add" class="btn ghost">Add line</button>
<div class="sum"><div><span>Subtotal</span><span id="sub">Rs 0</span></div><div><span>Tax %</span><input id="tax" type="number" value="0" min="0" style="width:80px"></div><div><span>Tax</span><span id="taxv">Rs 0</span></div><div class="tot"><span>Total</span><span id="tot">Rs 0</span></div></div>
<div class="head" style="margin:22px 0 0;justify-content:flex-end"><button id="save" class="btn ghost">Save draft</button><button id="send" class="btn">Send invoice</button></div></div></div><script src="js/app.js"></script></body></html>
